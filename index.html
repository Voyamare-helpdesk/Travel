<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voyamare: flights from Mauritius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a2a33;--lagoon:#0e5e6f;--mist:#eef4f5;--line:#c9dadd;--sun:#f2b63d;--white:#fff;--muted:#55727a}
*{box-sizing:border-box}
body{margin:0;font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif;color:var(--ink);background:var(--mist)}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
.hero{background:var(--ink);color:var(--white);padding:3rem 1.25rem 3.5rem}
.wrap{max-width:960px;margin:0 auto}
.brand{font:800 1.5rem "Bricolage Grotesque",sans-serif;letter-spacing:.01em;margin-bottom:1.5rem;color:var(--sun)}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;max-width:14ch}
.hero p{color:#b9d3d8;max-width:46ch;margin:.75rem 0 1.75rem}
form.search{display:grid;grid-template-columns:repeat(6,1fr);gap:.75rem;background:var(--white);padding:1rem;border-radius:6px;color:var(--ink)}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:.25rem}
input,select{font:inherit;padding:.6rem;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:var(--white);min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.f2{grid-column:span 2}
button{font:600 1rem "Source Sans 3",sans-serif;border:0;border-radius:4px;padding:.7rem 1.2rem;cursor:pointer;background:var(--sun);color:var(--ink)}
button.alt{background:var(--lagoon);color:var(--white)}
button:disabled{opacity:.6;cursor:wait}
form.search button{align-self:end;grid-column:span 2}
main{padding:2rem 1.25rem 4rem}
.status{color:var(--muted);margin:0 0 1rem}
.err{color:#9b2c2c;font-weight:600}
.offer{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;background:var(--white);border-left:6px solid var(--lagoon);padding:1rem 1.25rem;margin-bottom:.75rem}
.route{display:flex;align-items:center;gap:.75rem;margin:.35rem 0}
.route b{font:700 1.4rem "Bricolage Grotesque",sans-serif}
.track{flex:1;min-width:60px;height:2px;background:var(--lagoon);position:relative}
.track i{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--lagoon)}
.meta{color:var(--muted);font-size:.9rem}
.price{text-align:right}
.price strong{display:block;font:700 1.6rem "Bricolage Grotesque",sans-serif}
.panel{background:var(--white);padding:1.5rem;border-radius:6px}
.panel h2{font-size:1.6rem;margin-bottom:1rem}
.pax{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin:.75rem 0 1.25rem}
table{width:100%;border-collapse:collapse;margin:1rem 0}
td{padding:.4rem 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
tr.total td{font-weight:700;font-size:1.15rem;border-bottom:0}
.hidden{display:none}
.note{font-size:.9rem;color:var(--muted)}
@media(max-width:720px){form.search{grid-template-columns:1fr 1fr}.f2,form.search button{grid-column:span 2}.offer{grid-template-columns:1fr}.price{text-align:left}.pax{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<div class="brand">Voyamare</div>
<h1>Flights from Mauritius, one clear price</h1>
<p>Search airlines, pick your flight and book in one place. Our service fee is shown before you pay.</p>
<form class="search" id="searchForm">
<label>From (airport code)<input id="from" value="MRU" maxlength="3" list="codes" required pattern="[A-Za-z]{3}"></label>
<label>To (airport code)<input id="to" value="CDG" maxlength="3" list="codes" required pattern="[A-Za-z]{3}"></label>
<label>Departure<input id="dep" type="date" required></label>
<label>Return (optional)<input id="ret" type="date"></label>
<label>Adults<select id="adults"></select></label>
<label>Cabin<select id="cabin"><option value="economy">Economy</option><option value="premium_economy">Premium economy</option><option value="business">Business</option></select></label>
<button class="f2" id="searchBtn">Search flights</button>
</form>
<datalist id="codes"><option value="MRU">Mauritius</option><option value="RUN">Réunion</option><option value="CDG">Paris</option><option value="LHR">London</option><option value="DXB">Dubai</option><option value="JNB">Johannesburg</option><option value="CPT">Cape Town</option><option value="BOM">Mumbai</option><option value="DEL">Delhi</option><option value="SIN">Singapore</option><option value="DOH">Doha</option><option value="NBO">Nairobi</option></datalist>
</div></header>

<main><div class="wrap">
<section id="results" aria-live="polite"></section>
<section id="checkout" class="panel hidden"></section>
</div></main>

<script>
// ---- Settings ----
const SERVICE_FEE = 21.99;            // your fee in USD, shown before payment
const API_BASE = "";                  // same server as this page (see server.js)
const DEMO = location.protocol === "file:" || new URLSearchParams(location.search).has("demo");

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, cur="USD") => new Intl.NumberFormat("en", {style:"currency", currency:cur}).format(n);
let offers = [], selected = null;

for (let i = 1; i <= 9; i++) $("adults").add(new Option(i, i));
const d = new Date(); d.setDate(d.getDate() + 30);
$("dep").value = d.toISOString().slice(0,10);
$("dep").min = new Date().toISOString().slice(0,10);

const fmtTime = iso => new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const fmtDur = iso => (iso||"").replace("PT","").replace("H","h ").replace("M","m").toLowerCase();

function demoOffers(from, to, dep) {
  const air = [["Air Mauritius",740,"PT12H20M",1],["Emirates",690,"PT15H05M",1],["Air France",810,"PT11H40M",0],["Turkish Airlines",655,"PT17H30M",1]];
  return air.map((a,i) => ({id:"demo_"+i, total_amount:String(a[1]), total_currency:"USD", owner:{name:a[0]},
    slices:[{duration:a[2], segments:[{origin:{iata_code:from}, destination:{iata_code:to}, departing_at:dep+"T"+["09:45","21:15","23:30","02:10"][i]+":00", arriving_at:dep+"T"+["22:05","12:20","11:10","19:40"][i]+":00", stops:a[3]}]}]}));
}

$("searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const from = $("from").value.toUpperCase(), to = $("to").value.toUpperCase();
  const btn = $("searchBtn"); btn.disabled = true; btn.textContent = "Searching…";
  $("checkout").classList.add("hidden");
  $("results").innerHTML = '<p class="status">Searching airlines…</p>';
  try {
    if (DEMO) { offers = demoOffers(from, to, $("dep").value); }
    else {
      const r = await fetch(API_BASE + "/api/search", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({from, to, departure:$("dep").value, ret:$("ret").value||null, adults:+$("adults").value, cabin:$("cabin").value})});
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Search failed");
      offers = j.offers;
    }
    renderOffers(from, to);
  } catch (err) {
    $("results").innerHTML = '<p class="err">' + esc(err.message) + ' Check the airport codes and dates, then search again.</p>';
  } finally { btn.disabled = false; btn.textContent = "Search flights"; }
});

function renderOffers(from, to) {
  if (!offers.length) { $("results").innerHTML = '<p class="status">No flights found for these dates. Try nearby dates or another airport.</p>'; return; }
  const n = +$("adults").value;
  $("results").innerHTML = '<p class="status">' + offers.length + ' flights, ' + esc(from) + ' to ' + esc(to) + (DEMO ? ' (sample data: run the server for live fares)' : '') + '</p>' +
    offers.map((o,i) => {
      const s = o.slices[0], f = s.segments[0], l = s.segments[s.segments.length-1], stops = s.segments.length - 1;
      return '<article class="offer"><div><strong>' + esc(o.owner.name) + '</strong>' +
        '<div class="route"><b>' + fmtTime(f.departing_at) + '</b><span>' + esc(f.origin.iata_code) + '</span><span class="track"><i style="left:' + (stops ? 45 : 85) + '%"></i></span><span>' + esc(l.destination.iata_code) + '</span><b>' + fmtTime(l.arriving_at) + '</b></div>' +
        '<div class="meta">' + fmtDur(s.duration) + ' · ' + (stops ? stops + (stops > 1 ? ' stops' : ' stop') : 'Direct') + '</div></div>' +
        '<div class="price"><strong>' + money(+o.total_amount + SERVICE_FEE * n, o.total_currency) + '</strong><span class="meta">total, fee included</span><br><button class="alt" data-i="' + i + '">Select</button></div></article>';
    }).join("");
  $("results").querySelectorAll("button[data-i]").forEach(b => b.onclick = () => openCheckout(+b.dataset.i));
}

function openCheckout(i) {
  selected = offers[i];
  const n = +$("adults").value, cur = selected.total_currency;
  const fare = +selected.total_amount, fee = SERVICE_FEE * n;
  const sameCur = cur === "USD";
  let pax = "";
  for (let p = 1; p <= n; p++) pax += '<h3>Passenger ' + p + '</h3><div class="pax">' +
    '<label>First name (as on passport)<input name="given_name" required></label><label>Last name (as on passport)<input name="family_name" required></label>' +
    '<label>Date of birth<input name="born_on" type="date" required></label><label>Gender<select name="gender"><option value="f">Female</option><option value="m">Male</option></select></label></div>';
  $("checkout").innerHTML = '<h2>Your booking: ' + esc(selected.owner.name) + '</h2>' +
    '<form id="bookForm">' + pax +
    '<div class="pax"><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" type="tel" required placeholder="+230 5xxx xxxx"></label></div>' +
    '<table><tr><td>Airline fare (' + n + ' adult' + (n > 1 ? 's' : '') + ')</td><td>' + money(fare, cur) + '</td></tr>' +
    '<tr><td>Our service fee (' + money(SERVICE_FEE) + ' per passenger)</td><td>' + money(fee) + '</td></tr>' +
    '<tr class="total"><td>Total to pay</td><td>' + (sameCur ? money(fare + fee) : money(fare, cur) + ' + ' + money(fee)) + '</td></tr></table>' +
    '<p class="note">Card details are entered in your payment provider’s secure form and never touch this site. Check each name against the passport: airlines charge to correct mistakes.</p>' +
    '<button class="alt" id="payBtn">Pay and book</button> <button type="button" id="backBtn">Back to results</button></form>';
  $("checkout").classList.remove("hidden"); $("checkout").scrollIntoView({behavior:"smooth"});
  $("backBtn").onclick = () => $("checkout").classList.add("hidden");
  $("bookForm").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target), pb = $("payBtn"); pb.disabled = true; pb.textContent = "Booking…";
    const names = fd.getAll("given_name"), fams = fd.getAll("family_name"), dobs = fd.getAll("born_on"), gens = fd.getAll("gender");
    const passengers = names.map((g,k) => ({given_name:g, family_name:fams[k], born_on:dobs[k], gender:gens[k]}));
    try {
      let ref = "DEMO" + Math.random().toString(36).slice(2,8).toUpperCase();
      if (!DEMO) {
        const r = await fetch(API_BASE + "/api/book", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({offer_id:selected.id, passengers, email:fd.get("email"), phone:fd.get("phone")})});
        const j = await r.json(); if (!r.ok) throw new Error(j.error || "Booking failed"); ref = j.reference;
      }
      $("checkout").innerHTML = '<h2>Booking confirmed</h2><p>Your reference is <strong>' + esc(ref) + '</strong>. A confirmation will be sent to ' + esc(fd.get("email")) + '.</p>' + (DEMO ? '<p class="note">This is a demo: no ticket was issued and no payment was taken.</p>' : '');
    } catch (err) {
      pb.disabled = false; pb.textContent = "Pay and book";
      $("checkout").insertAdjacentHTML("afterbegin", '<p class="err">' + esc(err.message) + ' You have not been charged.</p>');
    }
  };
}
</script>
</body>
</html>
